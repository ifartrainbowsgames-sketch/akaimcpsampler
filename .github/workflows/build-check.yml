name: Build Check

# Fast web build gate. Runs on every push and pull request targeting main so
# a broken `npm run build` (e.g. tsc errors) is caught before merge, instead
# of only surfacing later as a failed Vercel production deploy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build
