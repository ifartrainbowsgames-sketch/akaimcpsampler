<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sampler Panel</title>
<style>
:root{
  --body-hi:#F2F0E9; --body:#E4E1D8; --body-lo:#CBC8BD; --body-edge:#A8A69C;
  --deck:#141414; --deck-hi:#2A2A2A;
  --btn:#4E4E50; --btn-hi:#67676A; --btn-lo:#343436; --btn-txt:#EDEDEA;
  --orange:#F07C1E; --orange-lo:#C25E10;
  --blue:#22A6E0; --blue-lo:#1580B0;
  --pad:#8E8E8C; --pad-hi:#A6A6A3; --pad-lo:#6E6E6C;
  --rgb:#1E9BE0;
  --rest:#97968F; --rest-hi:#ACABA4;
  --red:#CE1E22;
  --ink:#25251F; --ink2:#3C3C35;
  --lcd:#0A0A0A; --lcd-y:#E8D24A; --lcd-c:#57C8D8;
  --f:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;display:flex;justify-content:center;align-items:flex-start;
  background:radial-gradient(120% 80% at 50% 0%,#2f6a86,#123448 55%,#07161f);
  padding:clamp(8px,2.5vw,32px);font-family:var(--f);-webkit-font-smoothing:antialiased;
}

/* base unit — everything scales off this font-size */
.unit{
  width:min(500px,100%);
  font-size:clamp(7.5px,2.35vw,11.5px);
  border-radius:1.1em;
  padding:.75em .75em 0;
  background:linear-gradient(155deg,var(--body-hi) 0%,var(--body) 30%,var(--body) 74%,var(--body-lo) 100%);
  box-shadow:
    inset 0 .12em 0 rgba(255,255,255,.9),
    inset -.18em 0 .3em rgba(0,0,0,.10),
    inset .18em 0 0 rgba(255,255,255,.5),
    0 .2em 0 var(--body-edge),
    0 .7em 0 #8b8980,
    0 1.6em 2.6em rgba(0,0,0,.55),
    0 3.4em 5em rgba(0,0,0,.45);
  position:relative;
}
.unit::after{
  content:"";position:absolute;inset:0;border-radius:1.1em;pointer-events:none;
  opacity:.22;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
}

/* ===================== TOP BLACK DECK ===================== */
.deck{
  background:linear-gradient(178deg,#1d1d1d,#0c0c0c 55%,#161616);
  border-radius:.5em;padding:.7em .85em .8em;margin-bottom:.9em;
  box-shadow:inset 0 .1em 0 rgba(255,255,255,.14),inset 0 -.1em .2em rgba(0,0,0,.8),
             0 .12em .3em rgba(0,0,0,.35);
  position:relative;
}
.deck::before{ /* gloss sweep */
  content:"";position:absolute;inset:0;border-radius:.5em;pointer-events:none;
  background:linear-gradient(112deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.03) 22%,transparent 40%);
}
.deckrow1{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:.5em}
.logo{line-height:1}
.logo b{
  display:block;font-size:2.05em;font-weight:800;letter-spacing:.05em;color:var(--red);
  font-family:Georgia,"Times New Roman",serif;
}
.logo i{
  display:block;font-size:.85em;font-style:italic;color:var(--red);
  letter-spacing:.02em;margin-top:-.15em;font-family:Georgia,serif;
}
.wordmark{
  font-size:1.5em;font-weight:700;letter-spacing:.02em;color:var(--red);
  align-self:flex-start;padding-top:.25em;
}
.fnrow{display:flex;gap:.55em;padding-top:.3em}
.fnbtn{
  width:3.3em;height:1.35em;border:0;border-radius:.18em;cursor:pointer;
  background:linear-gradient(180deg,#4a4a4c,#2b2b2d);
  box-shadow:inset 0 .08em 0 rgba(255,255,255,.25),0 .1em .2em rgba(0,0,0,.6);
  font:inherit;font-size:1em;
}
.fnbtn:active{transform:translateY(.08em)}

.deckrow2{display:grid;grid-template-columns:8.5em 1fr 7.4em;gap:.7em;align-items:center}

.volwrap{display:flex;align-items:center;gap:.5em}
.volstack{display:flex;flex-direction:column;align-items:center;gap:.25em}
.knob{
  border-radius:50%;position:relative;cursor:grab;touch-action:none;
  background:
    radial-gradient(circle at 42% 28%,#FBFAF5,#E2E0D6 45%,#B9B7AD 78%,#94928A);
  box-shadow:
    inset 0 -.15em .3em rgba(0,0,0,.35),
    inset 0 .12em .1em rgba(255,255,255,.9),
    0 .15em .35em rgba(0,0,0,.6);
}
.knob i{
  position:absolute;left:50%;top:9%;width:.17em;height:36%;margin-left:-.085em;
  background:#55534C;border-radius:.1em;transform-origin:50% 100%;
}
.knob.vol{width:4.2em;height:4.2em}
.knob.k{width:3.5em;height:3.5em}
.knob.enc{width:5.4em;height:5.4em}
.knob.enc::after{
  content:"";position:absolute;inset:14%;border-radius:50%;
  background:radial-gradient(circle at 40% 32%,#FCFBF6,#DFDDD3 60%,#B5B3A9);
  box-shadow:inset 0 .1em .1em rgba(255,255,255,.9),0 .06em .12em rgba(0,0,0,.25);
}
.knob.enc i{display:none}
.knobtick{position:absolute;left:50%;bottom:-.55em;width:.22em;height:.22em;margin-left:-.11em;border-radius:50%;background:#1a1a1a}
.vollabel{font-size:.78em;font-weight:700;color:#E8E8E4;letter-spacing:.05em;text-align:center;line-height:1.25}
.bankltr{font-size:1.5em;font-weight:700;color:#EFEFEC}
.greenled{width:1.5em;height:.5em;border-radius:.12em;background:#3FBF52;box-shadow:0 0 .5em rgba(63,191,82,.8)}

.lcdframe{
  border-radius:.2em;padding:.15em;background:#2a2a2a;
  box-shadow:inset 0 0 0 .08em #000,0 .08em .2em rgba(0,0,0,.7);
}
.lcd{
  position:relative;aspect-ratio:4/3.05;background:var(--lcd);overflow:hidden;
  font-family:ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;
}
.lcd::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(118deg,rgba(255,255,255,.09),transparent 38%);
}
.tabs{display:flex;font-size:.82em;color:#9a9a92;flex:0 0 auto}
.tabs div{flex:1;text-align:center;padding:.15em 0;border-bottom:.08em solid #3a3a34}
.tabs div.on{background:#3d3d36;color:#fff}
.infoline{
  display:flex;align-items:center;gap:.3em;padding:.15em .25em;font-size:.72em;color:var(--lcd-y);
  flex:0 0 auto;
}
.chip{border:.06em solid var(--lcd-c);color:var(--lcd-c);padding:0 .18em;font-size:.85em;line-height:1.35}
.lanes{flex:1;display:flex;flex-direction:column;gap:.15em;padding:.15em .25em;min-height:0}
.lane{flex:1;position:relative;min-height:0}
.lane svg{width:100%;height:100%;display:block}
.footline{
  display:flex;justify-content:space-between;align-items:center;gap:.3em;
  padding:.15em .3em .25em;font-size:.72em;color:#cfcfc6;flex:0 0 auto;
}
.slider{flex:1;height:.75em;border:.06em solid #6f6f66;position:relative;margin-left:.3em}
.slider i{position:absolute;top:.08em;bottom:.08em;left:8%;width:46%;background:#6f6f66}
.lcd-list{font-size:.85em;line-height:1.5;padding:.2em .3em;color:#a8a89e;flex:1}
.lcd-list div.sel{background:var(--lcd-y);color:#111;font-weight:700}
.g16{display:grid;grid-template-columns:repeat(4,1fr);gap:.15em;padding:.2em;flex:1}
.g16 span{border:.06em solid #4d4d45;font-size:.6em;display:flex;align-items:center;justify-content:center;text-align:center;color:#a8a89e;line-height:1.05;padding:.1em}
.g16 span.on{background:var(--lcd-y);color:#111;border-color:var(--lcd-y);font-weight:700}

.speaker{
  height:4.9em;border-radius:.35em;
  background:
    radial-gradient(circle at .12em .12em,rgba(255,255,255,.10) .07em,transparent .09em) 0 0/.34em .34em,
    linear-gradient(170deg,#3a3a3a,#232323 60%,#2e2e2e);
  box-shadow:inset 0 .07em 0 rgba(255,255,255,.16),inset 0 -.07em .12em rgba(0,0,0,.7),0 .07em .15em rgba(0,0,0,.5);
}

/* ===================== BODY ===================== */
.body{display:grid;grid-template-columns:7.6em 1fr 7.6em;gap:.65em;margin-bottom:.6em}

/* --- section headers with bracket rule --- */
.sechead{
  display:flex;align-items:center;gap:.35em;font-size:.72em;font-weight:700;
  letter-spacing:.16em;color:var(--ink);margin-bottom:.35em;
}
.sechead::before,.sechead::after{content:"";flex:1;height:.07em;background:var(--ink);opacity:.75}

/* --- generic panel buttons --- */
.pb{
  border:0;cursor:pointer;font:inherit;padding:0;background:none;display:block;width:100%;
}
.pb .cap{
  display:flex;align-items:center;justify-content:center;text-align:center;
  height:2.15em;border-radius:.22em;line-height:1.02;
  font-size:.72em;font-weight:700;letter-spacing:.02em;color:var(--btn-txt);
  background:linear-gradient(180deg,var(--btn-hi),var(--btn) 45%,var(--btn-lo));
  box-shadow:inset 0 .1em 0 rgba(255,255,255,.22),inset 0 -.15em .2em rgba(0,0,0,.35),
             0 .16em 0 #232325,0 .3em .4em rgba(0,0,0,.35);
  transition:transform .05s,box-shadow .05s,filter .12s;padding:0 .2em;
}
.pb:active .cap{transform:translateY(.16em);box-shadow:inset 0 .12em .25em rgba(0,0,0,.6)}
.pb .sub{
  display:block;font-size:.6em;font-weight:700;letter-spacing:.02em;color:var(--ink2);
  text-align:center;margin-top:.2em;line-height:1;
}
.pb.orange .cap{background:linear-gradient(180deg,#FF9A3D,var(--orange) 45%,var(--orange-lo));color:#fff;
  box-shadow:inset 0 .1em 0 rgba(255,255,255,.35),0 .16em 0 #8d430b,0 .3em .4em rgba(0,0,0,.35)}
.pb.blue .cap{background:linear-gradient(180deg,#5FC6EF,var(--blue) 45%,var(--blue-lo));color:#fff;
  box-shadow:inset 0 .1em 0 rgba(255,255,255,.35),0 .16em 0 #0f5d81,0 .3em .4em rgba(0,0,0,.35)}
.pb.lit .cap{filter:brightness(1.35) saturate(1.2);box-shadow:0 0 .9em rgba(255,190,90,.55),0 .16em 0 #232325}
.pb.tall .cap{height:2.9em}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.4em .45em}

/* --- fader --- */
.faderbox{margin:.55em 0 .5em;display:flex;justify-content:center}
.fader{
  position:relative;width:3.3em;height:9.5em;border-radius:.2em;
  background:linear-gradient(90deg,rgba(0,0,0,.06),transparent 30%);
}
.fader .slot{
  position:absolute;left:50%;top:.5em;bottom:.5em;width:.55em;margin-left:-.275em;border-radius:.3em;
  background:linear-gradient(90deg,#1b1b1b,#3a3a3a,#1b1b1b);
  box-shadow:inset 0 .15em .3em rgba(0,0,0,.9),0 .05em 0 rgba(255,255,255,.55);
}
.fader .knobcap{
  position:absolute;left:50%;width:1.9em;height:2.5em;margin-left:-.95em;border-radius:.18em;
  background:linear-gradient(180deg,#F4F2EB,#D9D7CD 50%,#B3B1A7);
  box-shadow:inset 0 .1em 0 rgba(255,255,255,.9),0 .14em .3em rgba(0,0,0,.5);
  cursor:grab;touch-action:none;
}
.fader .knobcap::after{content:"";position:absolute;left:.18em;right:.18em;top:1.1em;height:.16em;background:#55534C;border-radius:.1em}
.faderled{
  position:absolute;left:2.5em;top:50%;width:.75em;height:.28em;background:#F2F0E8;border-radius:.06em;
  box-shadow:0 0 .4em rgba(255,255,255,.9);
}

/* --- pads --- */
.kknobs{display:grid;grid-template-columns:repeat(3,1fr);gap:.5em;margin-bottom:.55em;justify-items:center}
.kwrap{display:flex;flex-direction:column;align-items:center;position:relative}
.klabel{font-size:.7em;font-weight:700;color:var(--ink);margin-top:.65em;letter-spacing:.06em}

.padwell{
  background:linear-gradient(180deg,#0f0f0f,#050505);
  border-radius:.25em;padding:.35em .35em .1em;
  box-shadow:inset 0 .1em .3em rgba(0,0,0,.9),0 .06em 0 rgba(255,255,255,.5);
}
.padrow{display:grid;grid-template-columns:repeat(4,1fr);gap:.3em;margin-bottom:.12em}
.padcell{display:flex;flex-direction:column}
.pad{
  border:0;padding:0;cursor:pointer;width:100%;aspect-ratio:1/.94;border-radius:.2em;
  background:linear-gradient(180deg,var(--pad-hi),var(--pad) 42%,var(--pad-lo));
  box-shadow:
    0 0 0 .09em var(--rgb),
    0 0 .5em rgba(30,155,224,.55),
    inset 0 .12em 0 rgba(255,255,255,.35),
    inset 0 -.2em .3em rgba(0,0,0,.35);
  transition:transform .05s,box-shadow .07s,background .1s;
}
.pad:active{transform:translateY(.13em)}
.pad.hit{
  background:linear-gradient(180deg,#FFE9A0,#F3CE4E 42%,#C39C1E);
  box-shadow:0 0 0 .09em #F5D34F,0 0 .9em rgba(243,206,78,.85),inset 0 .12em 0 rgba(255,255,255,.5);
}
.pad.red{background:linear-gradient(180deg,#E58C84,#C0463B 42%,#8A2A22);
  box-shadow:0 0 0 .09em #D8564A,0 0 .7em rgba(216,86,74,.7),inset 0 .12em 0 rgba(255,255,255,.35)}
.pad.grn{background:linear-gradient(180deg,#9EE3A6,#4FB85C 42%,#2E7F38);
  box-shadow:0 0 0 .09em #5CD06B,0 0 .8em rgba(92,208,107,.75),inset 0 .12em 0 rgba(255,255,255,.4)}
.padlegend{
  display:flex;justify-content:space-between;gap:.2em;font-size:.5em;font-weight:700;
  color:#c9c9c2;letter-spacing:.01em;padding:.18em .05em .22em;line-height:1;
}
.padlegend b{color:#8f8f88;font-weight:700}

/* --- right column --- */
.rcol{display:flex;flex-direction:column;gap:.4em}
.encblock{display:flex;align-items:flex-start;gap:.2em;justify-content:center;margin:.35em 0 .1em}
.micicon{font-size:1.15em;line-height:1;color:var(--ink);margin-top:.3em}
.pmrow{display:grid;grid-template-columns:1fr 1fr;gap:.45em}
.pmrow .cap{font-size:1.15em;height:2.15em}
.tp .cap{height:2.15em}
.tp.stop .cap::before{content:"";width:.85em;height:.85em;background:#F0F0EC;border-radius:.06em}
.tp.play .cap::before{content:"";width:0;height:0;border-left:.85em solid #4ED07A;border-top:.5em solid transparent;border-bottom:.5em solid transparent}

/* --- wrist rest --- */
.rest{
  height:4.6em;margin:0 -.15em;border-radius:.5em .5em 1em 1em;
  background:linear-gradient(180deg,var(--rest-hi),var(--rest) 35%,#7f7e78);
  box-shadow:inset 0 .12em 0 rgba(255,255,255,.45),inset 0 -.25em .4em rgba(0,0,0,.3),
             0 -.1em .2em rgba(0,0,0,.12);
}

.hint{margin-top:1.1em;text-align:center;font-size:11px;color:#9fc3d6;line-height:1.7;max-width:460px}
.hint b{color:#dff0f9}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
</style>
</head>
<body>
<div>
<div class="unit">

  <!-- ===== BLACK DECK ===== -->
  <div class="deck">
    <div class="deckrow1">
      <div class="logo"><b>NOVA</b><i>audio labs</i></div>
      <div class="fnrow">
        <button class="fnbtn" data-fn="1"></button>
        <button class="fnbtn" data-fn="2"></button>
        <button class="fnbtn" data-fn="3"></button>
      </div>
      <div class="wordmark">SP SAMPLE</div>
    </div>

    <div class="deckrow2">
      <div class="volwrap">
        <div class="volstack">
          <div class="knob vol" id="vol"><i></i><span class="knobtick"></span></div>
          <div class="vollabel">MAIN<br>VOLUME</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:.9em">
          <div class="bankltr" id="bankLtr">A</div>
          <div class="greenled"></div>
        </div>
      </div>

      <div class="lcdframe">
        <div class="lcd">
          <div class="tabs">
            <div class="on" id="tab1">Trim</div><div id="tab2">Tune</div><div id="tab3">Filter</div>
          </div>
          <div id="lcdInner"></div>
        </div>
      </div>

      <div class="speaker"></div>
    </div>
  </div>

  <!-- ===== BODY ===== -->
  <div class="body">

    <!-- LEFT COLUMN -->
    <div>
      <div class="sechead">MODE</div>
      <div class="grid2">
        <button class="pb lit" data-screen="sample"><span class="cap">SAMPLE</span><span class="sub">INPUT CONFIG</span></button>
        <button class="pb" data-screen="seq"><span class="cap">SEQ</span><span class="sub">STEP EDIT</span></button>
        <button class="pb orange" data-screen="padfx"><span class="cap">PAD FX</span><span class="sub">FLEX BEAT</span></button>
        <button class="pb orange" data-screen="knobfx"><span class="cap">KNOB FX</span><span class="sub">FX SELECT</span></button>
      </div>

      <div class="grid2" style="margin-top:.55em">
        <button class="pb" id="shiftBtn"><span class="cap">SHIFT</span><span class="sub">&nbsp;</span></button>
        <button class="pb" id="bankBtn"><span class="cap">PAD BANK</span><span class="sub">&nbsp;</span></button>
      </div>

      <div class="faderbox">
        <div class="fader" id="fader">
          <div class="slot"></div>
          <div class="knobcap" id="fcap" style="bottom:38%"></div>
          <div class="faderled"></div>
        </div>
      </div>

      <div class="grid2">
        <button class="pb" data-util="erase"><span class="cap">ERASE</span><span class="sub">COPY</span></button>
        <button class="pb" data-util="rpt"><span class="cap">NOTE REPEAT</span><span class="sub">TRIPLET</span></button>
      </div>
    </div>

    <!-- CENTRE -->
    <div>
      <div class="kknobs">
        <div class="kwrap"><div class="knob k" data-k="1"><i></i><span class="knobtick"></span></div><div class="klabel">K1</div></div>
        <div class="kwrap"><div class="knob k" data-k="2"><i></i><span class="knobtick"></span></div><div class="klabel">K2</div></div>
        <div class="kwrap"><div class="knob k" data-k="3"><i></i><span class="knobtick"></span></div><div class="klabel">K3</div></div>
      </div>
      <div class="padwell" id="padwell"></div>
    </div>

    <!-- RIGHT COLUMN -->
    <div class="rcol">
      <div class="sechead">PAD PLAY</div>
      <div class="grid2">
        <button class="pb blue" data-toggle="chop"><span class="cap">CHOP</span><span class="sub">NOTE ON</span></button>
        <button class="pb blue" data-toggle="mute"><span class="cap">MUTE</span><span class="sub">UNMUTE ALL</span></button>
        <button class="pb blue" data-toggle="loop"><span class="cap">LOOP</span><span class="sub">REVERSE</span></button>
        <button class="pb blue" data-toggle="lvl"><span class="cap">16 LEVELS</span><span class="sub">TYPE</span></button>
      </div>

      <div class="grid2" style="margin-top:.3em">
        <button class="pb" data-screen="browser"><span class="cap">SAMPLE SELECT</span><span class="sub">SAVE SAMPLE</span></button>
        <button class="pb" data-util="tap"><span class="cap">TAP TEMPO</span><span class="sub">METRO</span></button>
      </div>

      <div class="encblock">
        <div class="knob enc" id="enc"></div>
        <div class="micicon">🎙</div>
      </div>

      <div class="pmrow">
        <button class="pb"><span class="cap">−</span><span class="sub">UNDO</span></button>
        <button class="pb"><span class="cap">+</span><span class="sub">REDO</span></button>
      </div>

      <div class="grid2">
        <button class="pb" data-screen="smprec"><span class="cap">SAMPLE RECORD</span><span class="sub">RECALL</span></button>
        <button class="pb" id="seqrec"><span class="cap">SEQ RECORD</span><span class="sub">RECALL</span></button>
      </div>

      <div class="grid2">
        <button class="pb tp stop" id="stop"><span class="cap"></span><span class="sub">&nbsp;</span></button>
        <button class="pb tp play" id="play"><span class="cap"></span><span class="sub">CONTINUE</span></button>
      </div>
    </div>
  </div>

  <div class="rest"></div>
</div>

<p class="hint">
  <b>MODE</b> buttons switch LCD screens · the three deck buttons cycle pages ·
  <b>SHIFT</b> + pad 5/8/9/12/14/16 opens its menu · knobs, fader and pads all respond.
</p>
</div>

<script>
/* pad numbering: bottom-left = 1, so display rows are 13-16 / 9-12 / 5-8 / 1-4 */
const SHIFTNAMES={1:"FULL LEVEL",2:"HALF SEQ",3:"DOUBLE SEQ",4:"COUNT-IN",5:"COMPRESSOR",6:"HALF SPEED",
7:"DOUBLE SPEED",8:"MIDI CONFIG",9:"FADER",10:"REC QUANTIZE",11:"RESAMPLE",12:"SONG",
13:"TRIM SAMPLE",14:"TIME CORRECT",15:"WARP",16:"PROJECT"};
const PADSCREEN={5:"comp",8:"midi",9:"fadermenu",12:"song",14:"timecorr",16:"project"};

const well=document.getElementById('padwell');
[[13,14,15,16],[9,10,11,12],[5,6,7,8],[1,2,3,4]].forEach(row=>{
  const r=document.createElement('div');r.className='padrow';
  row.forEach(n=>{
    const c=document.createElement('div');c.className='padcell';
    c.innerHTML=`<button class="pad" data-n="${n}"></button>
      <div class="padlegend"><b>${n}</b><span>${SHIFTNAMES[n]}</span></div>`;
    r.appendChild(c);
  });
  well.appendChild(r);
});

/* ---------- LCD ---------- */
const waveSVG=(seed,color)=>{
  let d='';
  for(let i=0;i<90;i++){
    const h=6+Math.abs(Math.sin(i*0.42+seed)*Math.cos(i*0.13+seed))*40+(i<6?0:0);
    d+=`<rect x="${i*1.111}" y="${50-h/2}" width="0.8" height="${h}" fill="${color}"/>`;
  }
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="none">
    <line x1="0" y1="50" x2="100" y2="50" stroke="#4a4636" stroke-width="0.5"/>${d}</svg>`;
};

const sampleScreen=(t1,t2,t3,foot)=>`
  <div class="infoline">A02 HipHop-Snr-Rys1 SY
    <span class="chip">♪</span><span class="chip">↔</span><span class="chip">⟳</span><span class="chip">16</span>
  </div>
  <div class="lanes">
    <div class="lane">${waveSVG(1,'#E8D24A')}</div>
    <div class="lane">${waveSVG(2.4,'#E8D24A')}</div>
  </div>
  <div class="footline"><span>${foot[0]}</span><span>${foot[1]}</span>
    <span>${foot[2]}</span><div class="slider"><i></i></div></div>`;

const listScreen=(items,sel)=>`<div class="lcd-list">${items.map((t,i)=>
  `<div class="${i===sel?'sel':''}">${t}</div>`).join('')}</div>`;

const gridScreen=(items,on)=>`<div class="g16">${items.map((t,i)=>
  `<span class="${i===on?'on':''}">${t}</span>`).join('')}</div>`;

const SCREENS={
  sample:{tabs:['Trim','Tune','Filter'],pages:[
    sampleScreen('Trim','Tune','Filter',['Start','End','Loop']),
    sampleScreen('Mix','Play','Filt Env',['Volume','Kit Vol','Pan']),
    sampleScreen('Amp Env','Warp','Reso',['Attack','Decay','Vel Sens'])]},
  seq:{tabs:['Seq','Bars','Swing'],pages:[`
    <div class="lcd-list"><div style="color:#E8D24A;font-size:1.5em;font-weight:700">93.0 BPM</div>
    <div>SEQ 01 · VERSE A · 4/4</div><div>Bars 4 · Q 1/16 · RT Swing 58%</div>
    <div style="margin-top:.4em">Metro REC · Count-in ON</div></div>`]},
  browser:{tabs:['Back','Drive','Preview'],pages:[
    listScreen(['◄ Samples','▸ Kicks','▸ Snares','▸ Hats','▸ Breaks','▸ Melodic'],2)]},
  smprec:{tabs:['Monitor','—','—'],pages:[`
    <div class="lanes"><div class="lane">${waveSVG(5,'#C0463B')}</div></div>
    <div class="footline"><span>Mic</span><span>Free</span><span>-24dB</span></div>`]},
  padfx:{tabs:['Latch','—','—'],pages:[gridScreen(
    ['HalfSpd','Chorus','Flanger','Phaser','Comb','LP Filt','HP Filt','BP Filt',
     'RingMod','LoFi','Color','Granul','BeatRpt','RevStep','Delay','Reverb'],9)]},
  knobfx:{tabs:['All Pads','Bypass','—'],pages:[
    listScreen(['Tape Delay','Diff Delay','Spring Reverb','Pumper','Vintage Emu','Vinyl Emu'],0)]},
  comp:{tabs:['Color','—','Bypass'],pages:[
    listScreen(['Attack      12.0 ms','Release     110 ms','Amount      62%','In Boost    +4 dB'],2)]},
  song:{tabs:['Export','Remove','Insert'],pages:[
    listScreen(['01  SEQ01  Verse A','02  SEQ03  Hook','03  SEQ01  Verse A','04  SEQ05  Bridge'],1)]},
  fadermenu:{tabs:['Back','—','On/Off'],pages:[
    listScreen(['Pad Volume','Pad Pan','Pad Tune','Pad Amp Attack','Pad Filter Cutoff','Kit Volume'],2)]},
  timecorr:{tabs:['Cancel','All Pads','Do It!'],pages:[
    listScreen(['Q          1/16','Shift      +2 tk','Swing      56%','Pads       ALL'],0)]},
  midi:{tabs:['—','—','—'],pages:[
    listScreen(['MIDI Port     EXTERNAL','MIDI In Ch    ALL','MIDI Out Ch   01','Pad MIDI In   ON','CV/Sync Out   ON'],0)]},
  project:{tabs:['—','—','—'],pages:[
    listScreen(['Load Project','Save Project','New Project','SD Card Access'],0)]}
};

let cur='sample',page=0;
function render(){
  const s=SCREENS[cur];
  document.getElementById('lcdInner').innerHTML=s.pages[page%s.pages.length];
  ['tab1','tab2','tab3'].forEach((id,i)=>{
    const el=document.getElementById(id);
    el.textContent=s.tabs[i]; el.classList.toggle('on',i===(page%3));
  });
}
function go(n){cur=n;page=0;
  document.querySelectorAll('[data-screen]').forEach(b=>b.classList.remove('lit'));
  const btn=document.querySelector(`[data-screen="${n}"]`); if(btn)btn.classList.add('lit');
  render();}
document.querySelectorAll('[data-screen]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.screen)));
document.querySelectorAll('.fnbtn').forEach(b=>b.addEventListener('click',()=>{page++;render();}));

/* shift */
let shifted=false;const sb=document.getElementById('shiftBtn');
const setShift=v=>{shifted=v;sb.classList.toggle('lit',v)};
sb.addEventListener('click',()=>setShift(!shifted));
addEventListener('keydown',e=>e.key==='Shift'&&setShift(true));
addEventListener('keyup',e=>e.key==='Shift'&&setShift(false));

/* pad bank */
const banks=['A','B','C','D','E','F','G','H'];let bi=0;
document.getElementById('bankBtn').addEventListener('click',()=>{
  bi=(bi+1)%8;document.getElementById('bankLtr').textContent=banks[bi];});

/* toggles */
document.querySelectorAll('[data-toggle]').forEach(b=>b.addEventListener('click',()=>{
  b.classList.toggle('lit');
  if(b.dataset.toggle==='mute')
    document.querySelectorAll('.pad').forEach(p=>p.classList.toggle('red',b.classList.contains('lit')));
}));

/* pads */
document.querySelectorAll('.pad').forEach(p=>p.addEventListener('pointerdown',()=>{
  const n=+p.dataset.n;
  if(shifted&&PADSCREEN[n]){go(PADSCREEN[n]);return;}
  p.classList.add('hit');setTimeout(()=>p.classList.remove('hit'),160);
}));

/* transport */
const play=document.getElementById('play'),stop=document.getElementById('stop'),sr=document.getElementById('seqrec');
let run=null,step=0;
play.addEventListener('click',()=>{
  play.classList.add('lit'); if(run)return;
  run=setInterval(()=>{
    const pads=[...document.querySelectorAll('.pad')];
    pads.forEach(p=>p.classList.remove('grn'));
    pads[[12,13,14,15][step%4]].classList.add('grn'); step++;
  },170);
});
stop.addEventListener('click',()=>{
  play.classList.remove('lit');sr.classList.remove('lit');clearInterval(run);run=null;
  document.querySelectorAll('.pad').forEach(p=>p.classList.remove('grn'));});
sr.addEventListener('click',()=>sr.classList.toggle('lit'));

/* knob drag */
document.querySelectorAll('.knob').forEach(k=>{
  let v=k.id==='vol'?-40:0,y0=0,drag=false;const ptr=k.querySelector('i');
  const set=n=>{v=Math.max(-150,Math.min(150,n));if(ptr)ptr.style.transform=`rotate(${v}deg)`};
  set(v);
  k.addEventListener('pointerdown',e=>{drag=true;y0=e.clientY;k.setPointerCapture(e.pointerId)});
  k.addEventListener('pointermove',e=>{if(drag){set(v+(y0-e.clientY)*1.3);y0=e.clientY}});
  k.addEventListener('pointerup',()=>drag=false);
});

/* fader */
const fd=document.getElementById('fader'),fc=document.getElementById('fcap');let fdrag=false;
const setF=y=>{const r=fd.getBoundingClientRect();
  let p=1-((y-r.top)/r.height);p=Math.max(.05,Math.min(.82,p));fc.style.bottom=(p*100)+'%'};
fd.addEventListener('pointerdown',e=>{fdrag=true;fd.setPointerCapture(e.pointerId);setF(e.clientY)});
fd.addEventListener('pointermove',e=>fdrag&&setF(e.clientY));
fd.addEventListener('pointerup',()=>fdrag=false);

render();
</script>
</body>
</html>
